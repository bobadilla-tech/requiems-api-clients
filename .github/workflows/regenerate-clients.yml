name: Weekly Client Regeneration

on:
  schedule:
    - cron: '0 0 * * 1' # Se ejecuta todos los lunes a la medianoche UTC
  workflow_dispatch:    # Permite ejecutarlo manualmente desde GitHub

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🌐 Descargar la última especificación OpenAPI
        run: curl -sL https://api.requiems.xyz/openapi.json -o openapi.json

      - name: 🛠️ Generar clientes y aplicar Version Bump
        id: process_clients
        run: |
          # 1. Leer versión actual (por defecto 1.0.0 si el archivo aún no existe)
          CURRENT_VERSION=$(cat VERSION 2>/dev/null | xargs || echo "1.0.0")
          echo "Versión actual: $CURRENT_VERSION"
          
          # Función empaquetada para generar los 5 lenguajes
          generate_clients() {
            local ver=$1
            # Inyectamos la versión para todos los gestores de paquetes (NPM, NuGet, PyPI, RubyGems)
            local props="packageVersion=$ver,npmVersion=$ver,gemVersion=$ver"
            
            npx @openapitools/openapi-generator-cli generate -i openapi.json -g typescript-axios -o typescript -p $props
            npx @openapitools/openapi-generator-cli generate -i openapi.json -g csharp -o csharp -p $props
            npx @openapitools/openapi-generator-cli generate -i openapi.json -g python -o python -p $props
            npx @openapitools/openapi-generator-cli generate -i openapi.json -g ruby -o ruby -p $props
            npx @openapitools/openapi-generator-cli generate -i openapi.json -g go -o go -p $props
          }

          # 2. Generar clientes con la versión actual para comparar
          generate_clients $CURRENT_VERSION

          # 3. Detectar si la generación produjo cambios en el código
          if [ -n "$(git status --porcelain)" ]; then
            echo "Cambios detectados. Aplicando version bump..."
            
            # Sumar +1 al parche (Patch version)
            IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
            NEW_VERSION="${major}.${minor}.$((patch+1))"
            
            echo "Nueva versión unificada: $NEW_VERSION"
            echo $NEW_VERSION > VERSION
            
            # 4. Regenerar inyectando la nueva versión
            generate_clients $NEW_VERSION
            
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No hay diferencias en los clientes generados."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Crear Pull Request
        if: steps.process_clients.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerar clientes OpenAPI y version bump"
          title: "Automated: Weekly Client Regeneration"
          body: |
            Se ha detectado una actualización en la especificación de la API.
            
            Este PR automático contiene:
            - Último archivo `openapi.json` actualizado.
            - Clientes regenerados para JS/TS, C#, Python, Ruby y Go.
            - **Version Bump** aplicado a todos los ecosistemas sincronizados bajo un archivo `VERSION` central.
          branch: "chore/automated-client-regeneration"
          base: "main"
          delete-branch: true